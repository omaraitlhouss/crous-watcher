name: CROUS Nice watcher

on:
  schedule:
    - cron: "*/30 * * * *"   # secours, si la chaîne de relance s'arrête
  workflow_dispatch:
    inputs:
      test:
        description: "Envoyer seulement un message de test"
        type: boolean
        default: false

# Un seul watcher à la fois : le suivant attend que le précédent finisse.
concurrency:
  group: crous-watcher
  cancel-in-progress: false

permissions:
  contents: write  # pour enregistrer crous_history.csv
  actions: write   # pour relancer le run suivant

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      CROUS_SEARCH_URL: "https://trouverunlogement.lescrous.fr/tools/47/search"
      POSTCODES: "06"
      EXCLUDE_POSTCODES: "06400,06150"   # Cannes, Cannes La Bocca
      CHECK_INTERVAL: "300"
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      WA_PHONE: ${{ secrets.WA_PHONE }}
      WA_APIKEY: ${{ secrets.WA_APIKEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Test
        if: ${{ inputs.test }}
        run: |
          python crous_nice_watcher.py --test
          python crous_nice_watcher.py --dry-run

      # Récupère la liste des logements déjà signalés (évite les doublons)
      - name: Restaurer l'état
        if: ${{ !inputs.test }}
        uses: actions/cache/restore@v4
        with:
          path: |
            crous_seen.json
            crous_snapshot.json
          key: crous-seen-${{ github.run_id }}
          restore-keys: crous-seen-

      # Vérifie toutes les 5 min pendant 55 min
      - name: Surveiller
        if: ${{ !inputs.test }}
        run: timeout 55m python crous_nice_watcher.py || true

      - name: Sauvegarder l'état
        if: ${{ always() && !inputs.test }}
        uses: actions/cache/save@v4
        with:
          path: |
            crous_seen.json
            crous_snapshot.json
          key: crous-seen-${{ github.run_id }}

      # Enregistre l'historique des apparitions/disparitions dans le dépôt
      - name: Enregistrer l'historique
        if: ${{ always() && !inputs.test }}
        run: |
          [ -f crous_history.csv ] || exit 0
          git config user.name "crous-watcher"
          git config user.email "crous-watcher@users.noreply.github.com"
          git add crous_history.csv
          git diff --cached --quiet && exit 0
          git commit -m "Historique CROUS $(date -u +%F' '%H:%M)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          echo "Push de l'historique impossible" && exit 1

      # Relance immédiatement le run suivant (le cron de GitHub n'est pas fiable).
      # Si tu annules un run (Cancel workflow), la chaîne s'arrête.
      - name: Relancer le watcher
        if: ${{ !inputs.test && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run crous.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
